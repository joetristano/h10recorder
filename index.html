<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Heart Monitor Recorder</title>
<style>
:root{--bg:#f6f6f4;--fg:#1a1a1a;--card:#fff;--mut:#666;--line:#d8d8d4;--acc:#d62839;--ok:#1a7f4b;--c1:#d62839;--c2:#1f6fd1;--c3:#e08a00;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--fg:#eee;--card:#1e1e1e;--mut:#999;--line:#333;--acc:#ff5c6c;--ok:#4cd08a;--c1:#ff5c6c;--c2:#5aa2ff;--c3:#ffb23d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121212;--fg:#eee;--card:#1e1e1e;--mut:#999;--line:#333;--acc:#ff5c6c;--ok:#4cd08a;--c1:#ff5c6c;--c2:#5aa2ff;--c3:#ffb23d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{flex:1;min-width:100px;font:inherit;font-weight:600;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
button:disabled{opacity:.4}
.hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.hd b{font-size:14px}.hd span{font-size:22px;font-weight:700}
.hd small{font-size:12px;font-weight:400;color:var(--mut)}
canvas{width:100%;height:130px;display:block}
#status{font-size:14px;color:var(--mut)}#status.ok{color:var(--ok)}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;margin-top:8px}
textarea{width:100%;height:110px;box-sizing:border-box;font:11px ui-monospace,monospace;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;margin-top:8px}
small{color:var(--mut)}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 10px}.g div{background:var(--bg);border-radius:8px;padding:6px 4px;text-align:center}.g b{display:block;font-size:17px}.g small{font-size:11px}
.f{display:flex;align-items:center;gap:6px;font-size:14px;flex:1}.f input{width:100%;min-width:0;box-sizing:border-box;font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.zr{display:grid;grid-template-columns:112px 1fr 44px;align-items:center;gap:8px;font-size:13px;padding:3px 0;opacity:.6}.zr.on{opacity:1;font-weight:700}
.zl i{font-style:normal;color:var(--mut);font-weight:400;font-size:11px;display:block}
.zb{height:12px;background:var(--bg);border-radius:6px;overflow:hidden}.zb span{display:block;height:100%}
.leg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 3px 0 8px}
</style>
</head>
<body>
<main>
<h1>Heart Monitor Recorder</h1>
<div class="card">
